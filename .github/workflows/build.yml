name: Build Eduka-Icons

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3 python3-pil librsvg2-2 \
            librsvg2-common libcairo2 libgtk-3-0 gtk-update-icon-cache dpkg make \
            fonts-dejavu-core papirus-icon-theme

      - name: Build Light, Dark and Bright
        run: make build

      - name: Validate themes and icon coverage
        run: make test

      - name: Render screenshots
        run: python3 tools/preview.py

      - name: Build the Debian package
        run: make deb

      - name: Upload package and screenshots
        uses: actions/upload-artifact@v4
        with:
          name: eduka-icons-${{ github.sha }}
          path: |
            dist/*.deb
            build/screenshots/*.png
            build/validation.json
            build/coverage-names.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
